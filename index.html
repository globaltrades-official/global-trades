<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Trades - Quality Goods and Wholesale Trading · Kozhikode</title>
    <meta name="description" content="Global Trades - PT Usha Rd, 4th Gate, Zilla Housing Colony, Vellayil, Kozhikode. Quality Goods and Wholesale Trading." />
    <link rel="icon" type="image/png" href="/company-logo.png" />
    <meta name="theme-color" content="#1A4C98" />
    <link rel="preload" href="/fonts/Alpino-Variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  </head>
  <body class="overflow-x-hidden bg-[#F4F8FC] text-[#081426]">
    <div id="root">
      <div style="position:fixed;inset:0;background:#F4F8FC;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;">
        <style>
          @keyframes gt-init-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes gt-init-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
        </style>
        <div style="position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border-radius:24px;border:1px solid #D0DFEF;box-shadow:0 20px 25px -5px rgba(8,20,38,0.08);padding:14px;">
          <div style="position:absolute;inset:-6px;border-radius:28px;border:2px dashed rgba(26,76,152,0.35);animation:gt-init-spin 7s linear infinite;"></div>
          <div style="position:absolute;inset:-3px;border-radius:26px;border:2px solid transparent;border-top-color:#1A4C98;border-right-color:#00A3E0;animation:gt-init-spin 1.2s linear infinite;"></div>
          <img src="/company-logo.png" alt="Global Trades" style="width:100%;height:100%;object-fit:contain;animation:gt-init-pulse 2s ease-in-out infinite;" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
