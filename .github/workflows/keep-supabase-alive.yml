name: Keep Supabase Database Active

on:
  schedule:
    # Run every 4 days at 04:00 UTC (Supabase pauses free tier after 7 days of inactivity)
    - cron: '0 4 */4 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-database:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          echo "Pinging Supabase REST API to keep PostgreSQL instance active..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -H "apikey: sb_publishable_34n8tcaN2jF3eJLYtpBlLA_xiriaDf8" \
            -H "Authorization: Bearer sb_publishable_34n8tcaN2jF3eJLYtpBlLA_xiriaDf8" \
            "https://osfewvmfxbghayaefkve.supabase.co/rest/v1/products?select=id&limit=1")
          
          echo "Supabase HTTP Response Status: $HTTP_STATUS"
          cat response.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Successfully pinged Supabase. 7-day inactivity timer reset."
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
            # Don't fail the job if paused or table schema changed, but log for visibility
          fi
