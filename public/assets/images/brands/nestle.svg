<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="nestleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005CA9" />
      <stop offset="100%" stop-color="#003D73" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="10" y="15" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#E2ECF8" stroke-width="2" />
  <!-- Nest Emblem -->
  <g transform="translate(35, 32)">
    <path d="M 10 35 Q 25 48 40 35 Q 35 25 15 28 Z" fill="#005CA9" opacity="0.8" />
    <circle cx="20" cy="24" r="5" fill="#005CA9" />
    <circle cx="30" cy="22" r="4" fill="#005CA9" />
    <path d="M 5 38 Q 25 54 45 38" fill="none" stroke="#A67C52" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- Nestlé Wordmark with Iconic N-bar -->
  <g transform="translate(95, 30)">
    <!-- The distinctive elongated N -->
    <path d="M 8 52 L 8 16 L 140 16 L 140 22 L 20 22 L 20 34 L 40 34 L 40 52 L 28 52 L 28 40 L 20 40 L 20 52 Z" fill="#005CA9" />
    <!-- estle letters -->
    <text x="32" y="52" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#005CA9" letter-spacing="-1">estlé</text>
    <text x="74" y="68" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#005CA9" letter-spacing="1">GOOD FOOD, GOOD LIFE</text>
  </g>
</svg>