  <text x="160" y="80" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#FFD100" text-anchor="middle" letter-spacing="1.5">GARDEN</text>
  <text x="160" y="94" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AUTHENTIC FLAVOURS</text>
